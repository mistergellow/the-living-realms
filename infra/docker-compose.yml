# Local development dependencies: PostgreSQL + Redis.
#   pnpm infra:up      start
#   pnpm infra:down    stop (data is kept in named volumes)
name: living-realms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: realms
      POSTGRES_PASSWORD: realms
      POSTGRES_DB: living_realms
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U realms -d living_realms']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
