<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>The Living Realms</title>
    <!-- Request #87: a loading screen drawn before any script runs. -->
    <style>
      html,
      body {
        margin: 0;
        background: #050403;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 60%, #1d1510 0%, #050403 70%);
        color: #efe4cc;
        transition:
          opacity 600ms ease,
          filter 600ms ease;
      }
      #boot.is-done {
        opacity: 0;
        filter: blur(6px);
        pointer-events: none;
      }
      #boot .boot-inner {
        display: grid;
        justify-items: center;
        gap: 1.6rem;
      }
      #boot .boot-title {
        margin: 0;
        font:
          600 clamp(2rem, 6vw, 4.2rem) / 1 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: 0.08em;
        text-shadow: 0 0 1.5rem rgba(208, 145, 47, 0.45);
        animation: boot-breathe 3s ease-in-out infinite;
      }
      #boot .boot-ring {
        width: 3.4rem;
        height: 3.4rem;
        border-radius: 50%;
        border: 1px solid rgba(201, 169, 106, 0.25);
        border-top-color: #e9c77c;
        box-shadow: 0 0 1rem rgba(208, 145, 47, 0.25);
        animation: boot-spin 1.4s linear infinite;
      }
      #boot .boot-hint {
        margin: 0;
        font:
          italic 1rem Georgia,
          serif;
        color: rgba(239, 228, 204, 0.5);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-breathe {
        50% {
          text-shadow: 0 0 2.4rem rgba(208, 145, 47, 0.7);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-title,
        #boot .boot-ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
        <p class="boot-title">The Living Realms</p>
        <div class="boot-ring"></div>
        <p class="boot-hint">The realms stir…</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
